server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Di belakang reverse proxy: jangan bocorkan port internal saat redirect /tentang -> /tentang/
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Aset hasil build Astro punya hash di nama file, aman di-cache lama
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
